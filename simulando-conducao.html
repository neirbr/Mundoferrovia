<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <title>Simulador Ferroviário</title>
 <style>
 body, html { margin: 0; padding: 0; background: black; font-family: Arial, sans-serif; overflow: hidden; }

 #game-container {
 position: relative;
 display: inline-block;
 margin: 0 auto;
 }

 #cenario {
 display: block;
 max-width: 100%;
 height: auto;
 }

 .interaction-layer {
 position: absolute;
 top: 0;
 left: 0;
 width: 100%;
 height: 100%;
 }

 /* BOTÕES INVISÍVEIS - Eles ficam exatamente sobre os desenhos da imagem */
 .btn-invisible {
 position: absolute;
 cursor: pointer;
 background: rgba(255, 255, 255, 0); /* Totalmente transparente */
 border: none;
 outline: none;
 }

 /* Posicionamento ajustado para bater com a imagem do painel */
 #btn-buzina { bottom: 2%; left: 2%; width: 15%; height: 8%; }
 #btn-dir-up { bottom: 6%; left: 22%; width: 10%; height: 4%; }
 #btn-dir-down { bottom: 2%; left: 22%; width: 10%; height: 4%; }
 #btn-pot-up { bottom: 6%; left: 37%; width: 10%; height: 4%; }
 #btn-pot-down { bottom: 2%; left: 37%; width: 10%; height: 4%; }
 #btn-freio { bottom: 2%; left: 50%; width: 25%; height: 8%; transform: translateX(-50%); }
 #btn-emergencia { bottom: 2%; right: 2%; width: 15%; height: 8%; }

 /* Textos de Status - Posicionados sobre os indicadores da imagem */
 .status-text { 
 position: absolute; 
 color: white; 
 font-weight: bold; 
 text-shadow: 2px 2px 2px black; 
 pointer-events: none; 
 font-size: 18px; 
 text-align: center;
 }
 #txt-direcao { bottom: 5%; left: 22%; width: 10%; }
 #txt-potencia { bottom: 5%; left: 37%; width: 10%; }
 #txt-velocidade { bottom: 2%; right: 18%; color: #00ff00; font-size: 22px; }
 </style>
</head>
<body>

 <div style="text-align: center;">
 <div id="game-container">
 <img id="cenario" src="https://raw.githubusercontent.com/neirbr/Mundoferrovia/main/assets/cenario-ferroviario.jpg">

 <div class="interaction-layer">
 <!-- Botões agora são invisíveis, apenas áreas de clique -->
 <div id="btn-buzina" class="btn-invisible" onclick="buzina()"></div>
 <div id="btn-dir-up" class="btn-invisible" onclick="mudarDirecao(1)"></div>
 <div id="btn-dir-down" class="btn-invisible" onclick="mudarDirecao(-1)"></div>
 <div id="btn-pot-up" class="btn-invisible" onclick="mudarPotencia(1)"></div>
 <div id="btn-pot-down" class="btn-invisible" onclick="mudarPotencia(-1)"></div>
 <div id="btn-freio" class="btn-invisible" onmousedown="startBrake()" onmouseup="stopBrake()" ontouchstart="startBrake()" ontouchend="stopBrake()"></div>
 <div id="btn-emergencia" class="btn-invisible" onclick="acionarEmergencia()"></div>

 <!-- Os textos aparecem dentro dos círculos/quadrados da imagem -->
 <div id="txt-direcao" class="status-text">N</div>
 <div id="txt-potencia" class="status-text">0</div>
 <div id="txt-velocidade" class="status-text">0 km/h</div>
 </div>
 </div>
 </div>

 <script>
 // --- MECÂNICA DE TRAÇÃO E FÍSICA ---
 let direcao = 'N';
 let pontoAceleracao = 0;
 let velocidadeAtual = 0;
 let freioAtivo = 0;
 let emergenciaAtiva = false;
 let freiosTravados = false;

 const limitesVelocidade = { 0: 0, 1: 15, 2: 25, 3: 35, 4: 45, 5: 55, 6: 65, 7: 75, 8: 100 };

 function mudarDirecao(v) {
 if (emergenciaAtiva) return;
 if (v > 0) {
 direcao = (direcao === 'N') ? 'F' : (direcao === 'R' ? 'N' : 'F');
 } else {
 direcao = (direcao === 'F') ? 'N' : (direcao === 'N' ? 'R' : 'N');
 }
 document.getElementById('txt-direcao').innerText = direcao;
 }

 function mudarPotencia(v) {
 if (emergenciaAtiva) return;
 pontoAceleracao = Math.max(0, Math.min(8, pontoAceleracao + v));
 document.getElementById('txt-potencia').innerText = pontoAceleracao;
 }

 function startBrake() { if (emergenciaAtiva) return; freioAtivo = 0.5; }
 function stopBrake() { freioAtivo = 0; }
 function acionarEmergencia() { emergenciaAtiva = true; }
 function aliviarFreios() { emergenciaAtiva = false; freiosTravados = false; alert("Freios aliviados!"); }
 function buzina() { alert("📢 BUZINA!"); }

 setInterval(() => {
 if (freiosTravados) return;
 let velAlvo = (direcao !== 'N') ? limitesVelocidade[pontoAceleracao] : 0;
 if (velocidadeAtual < velAlvo) velocidadeAtual += 0.1;
 else if (velocidadeAtual > velAlvo) velocidadeAtual -= 0.05;
 if (freioAtivo > 0) velocidadeAtual -= (freioAtivo * 0.5);
 if (emergenciaAtiva) {
 velocidadeAtual -= 0.3;
 if (velocidadeAtual <= 0) {
 velocidadeAtual = 0;
 freiosTravados = true;
 }
 }
 if (velocidadeAtual < 0) velocidadeAtual = 0;
 document.getElementById('txt-velocidade').innerText = Math.round(velocidadeAtual) + " km/h";
 }, 50);

 window.addEventListener('dblclick', aliviarFreios);
 </script>
</body>
</html>
