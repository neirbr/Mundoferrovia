<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulando Condução 2D</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            font-family: Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            flex-direction: column;
        }

        /* Container principal */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Área do cenário (parte superior) */
        #scenario {
            flex: 1;
            background-image: url('https://raw.githubusercontent.com/neirbr/Mundoferrovia/main/assets/cenario-ferroviario.jpg');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            overflow: hidden; /* Impede scroll indesejado */
        }

        /* Área do painel (parte inferior, fixa) */
        #control-panel {
            height: 20vh; /* Altura fixa para o painel */
            background-image: url('https://raw.githubusercontent.com/neirbr/Mundoferrovia/main/assets/cenario-ferroviario.jpg');
            background-size: cover;
            background-position: center bottom; /* Fixa o painel na parte inferior */
            background-repeat: no-repeat;
            position: relative;
        }

        /* Camada de interação (sobreposta ao painel) */
        .interaction-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        /* Zonas de clique */
        .click-zone {
            position: absolute;
            background: rgba(255, 0, 0, 0.4);
            border: 1px solid red;
            cursor: pointer;
            z-index: 10;
        }

        /* POSICIONAMENTO DOS BOTÕES (ajustado para o painel fixo) */
        #zone-buzina {
            bottom: 15%; /* Ajuste para o painel fixo */
            left: 2%;
            width: 15%;
            height: 8%;
        }

        #zone-dir-up {
            bottom: 25%;
            left: 20%;
            width: 12%;
            height: 4%;
        }

        #zone-dir-down {
            bottom: 35%;
            left: 20%;
            width: 12%;
            height: 4%;
        }

        #zone-pot-up {
            bottom: 25%;
            left: 35%;
            width: 12%;
            height: 4%;
        }

        #zone-pot-down {
            bottom: 35%;
            left: 35%;
            width: 12%;
            height: 4%;
        }

        #zone-freio {
            bottom: 15%;
            left: 50%;
            width: 25%;
            height: 8%;
        }

        #zone-emergencia {
            bottom: 15%;
            right: 2%;
            width: 15%;
            height: 8%;
        }

        /* Textos de status */
        .status-text {
            position: absolute;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 2px black;
            pointer-events: none;
            font-size: 18px;
            text-align: center;
        }

        #txt-direcao {
            bottom: 30%;
            left: 22%;
        }

        #txt-potencia {
            bottom: 30%;
            left: 37%;
        }

        #txt-velocidade {
            bottom: 5%;
            right: 15%;
            color: #00ff00;
            font-size: 22px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Cenário (parte superior) -->
        <div id="scenario"></div>

        <!-- Painel de controles (parte inferior fixa) -->
        <div id="control-panel">
            <div class="interaction-layer">
                <div id="zone-buzina" class="click-zone" onclick="buzina()"></div>
                <div id="zone-dir-up" class="click-zone" onclick="mudarDir(1)"></div>
                <div id="zone-dir-down" class="click-zone" onclick="mudarDir(-1)"></div>
                <div id="zone-pot-up" class="click-zone" onclick="mudarPot(1)"></div>
                <div id="zone-pot-down" class="click-zone" onclick="mudarPot(-1)"></div>
                <input type="range" id="slider-freio" min="0" max="100" value="0" oninput="freio(this.value)" style="position: absolute; bottom: 15%; left: 50%; width: 25%; height: 8%; z-index: 20; transform: translateX(-50%);">
                <div id="zone-emergencia" class="click-zone" onclick="emergencia()"></div>

                <!-- Textos -->
                <div id="txt-direcao" class="status-text">N</div>
                <div id="txt-potencia" class="status-text">0</div>
                <div id="txt-velocidade" class="status-text">0</div>
            </div>
        </div>
    </div>

    <script>
        let dir = 'N';
        let pot = 0;

        function buzina() { alert("Buzina! 📢"); }

        function mudarDir(v) {
            if(v > 0) dir = (dir === 'N') ? 'F' : (dir === 'R' ? 'N' : 'F');
            else dir = (dir === 'F') ? 'N' : (dir === 'N' ? 'R' : 'N');
            document.getElementById('txt-direcao').innerText = dir;
        }

        function mudarPot(v) {
            pot = Math.max(0, Math.min(8, pot + v));
            document.getElementById('txt-potencia').innerText = pot;
        }

        function freio(v) { console.log("Freio: " + v); }
        function emergencia() { alert("EMERGÊNCIA! 🚨"); }
    </script>
</body>
</html>
