<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Simulador de Locomotiva Profissional</title>
    <style>
        body {
            margin: 0;
            background: #121212;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Arial', sans-serif;
            color: white;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 500px;
            margin: 20px 0;
            background: #222;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
        }

        canvas {
            background: linear-gradient(to bottom, #4CAF50, #2E7D32);
            display: block;
            border-radius: 8px;
        }

        /* PAINEL DE CONTROLE (Layout da imagem) */
        #control-panel {
            width: 900px;
            height: 180px;
            background: #0a192f;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 4px solid #d4af37;
            border-bottom: 4px solid #d4af37;
            padding: 0 20px;
            box-sizing: border-box;
            user-select: none;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            border-right: 2px solid #d4af37;
            flex: 1;
        }

        .control-group:last-child { border-right: none; }

        .label {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 15px;
            color: #fff;
            letter-spacing: 1px;
        }

        /* Botões Circulares */
        .circle-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            background: #0a192f;
            color: white;
            transition: 0.2s;
        }

        .btn-emergency {
            background: radial-gradient(circle, #ff4d4d, #b30000);
            color: white;
            width: 70px;
            height: 70px;
            font-size: 30px;
        }

        .btn-emergency.active {
            box-shadow: 0 0 20px #ff0000;
            transform: scale(0.95);
        }

        /* Setas de Direção e Potência */
        .arrow-btn {
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            cursor: pointer;
            transition: 0.2s;
            margin: 5px;
        }

        .arrow-up { border-bottom: 20px solid #d4af37; }
        .arrow-down { border-top: 20px solid #d4af37; }

        /* Slider de Freio */
        .brake-container {
            width: 180px;
            height: 30px;
            background: #2c3e50;
            border-radius: 15px;
            position: relative;
            border: 2px solid #d4af37;
            overflow: hidden;
        }

        #brake-fill {
            width: 0%;
            height: 100%;
            background: #3498db;
            position: absolute;
            left: 0;
        }

        #brake-handle {
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, #f1c40f, #d4af37);
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
            z-index: 2;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        /* HUD de Velocidade */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="800" height="500"></canvas>
        <div id="hud">
            <div>Velocidade: <span id="speed">0</span> km/h</div>
            <div>Direção: <span id="direction">N</span></div>
            <div>Potência: <span id="power">0</span></div>
        </div>
    </div>

    <div id="control-panel">
        <!-- BUZINA -->
        <div class="control-group">
            <div class="label">BUZINA</div>
            <div class="circle-btn" onclick="playHorn()">📢</div>
        </div>

        <!-- DIREÇÃO -->
        <div class="control-group" id="group-dir">
            <div class="label">DIREÇÃO</div>
            <div class="arrow-btn arrow-up" onclick="changeDirection(1)"></div>
            <div class="circle-btn" id="display-dir">N</div>
            <div class="arrow-btn arrow-down" onclick="changeDirection(-1)"></div>
        </div>

        <!-- POTÊNCIA -->
        <div class="control-group" id="group-pot">
            <div class="label">POTÊNCIA</div>
            <div class="arrow-btn arrow-up" onclick="changePower(1)"></div>
            <div class="circle-btn" id="display-pot">0</div>
            <div class="arrow-btn arrow-down" onclick="changePower(-1)"></div>
        </div>

        <!-- FREIO -->
        <div class="control-group" id="group-brake">
            <div class="label">FREIO</div>
            <div class="brake-container" id="brake-track">
                <div id="brake-fill"></div>
                <div id="brake-handle"></div>
            </div>
        </div>

        <!-- EMERGÊNCIA -->
        <div class="control-group">
            <div class="label">EMERGÊNCIA</div>
            <div class="circle-btn btn-emergency" id="btn-emerg" onclick="toggleEmergency()">!</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const speedDisplay = document.getElementById('speed');
        const directionDisplay = document.getElementById('direction');
        const powerDisplay = document.getElementById('power');

        // ESTADO DO JOGO
        let state = {
            progresso: 0,          // 0% a 100% do trilho
            velocidadeAtual: 0,    // km/h
            direcao: 'N',         // 'F' = Frente, 'N' = Neutro, 'R' = Ré
            potencia: 0,          // 0 a 8
            freio: 0,             // 0 a 1
            emergencia: false,
            estacaoDestino: 1     // 0 = início, 1 = fim
        };

        // Velocidades máximas por ponto de potência
        const velLimites = [0, 15, 25, 35, 45, 55, 65, 75, 100];

        // Trilho (pontos para curva suave)
        const trilho = [
            { x: 100, y: 200 }, { x: 200, y: 200 }, { x: 300, y: 180 },
            { x: 400, y: 150 }, { x: 500, y: 120 }, { x: 600, y: 100 },
            { x: 700, y: 100 }, { x: 700, y: 400 }, { x: 600, y: 400 },
            { x: 500, y: 420 }, { x: 400, y: 450 }, { x: 300, y: 480 },
            { x: 200, y: 500 }, { x: 100, y: 500 }
        ];

        // Função para calcular posição no trilho
        function getPosicaoNoTrilho(progresso) {
            const idx = Math.min(Math.floor(progresso * (trilho.length - 1)), trilho.length - 2);
            const p = progresso * (trilho.length - 1) - idx;
            const x = trilho[idx].x + (trilho[idx + 1].x - trilho[idx].x) * p;
            const y = trilho[idx].y + (trilho[idx + 1].y - trilho[idx].y) * p;
            return { x, y };
        }

        // Função para calcular ângulo do trilho
        function getAnguloNoTrilho(progresso) {
            const idx = Math.min(Math.floor(progresso * (trilho.length - 1)), trilho.length - 2);
            const p = progresso * (trilho.length - 1) - idx;
            const dx = trilho[idx + 1].x - trilho[idx].x;
            const dy = trilho[idx + 1].y - trilho[idx].y;
            return Math.atan2(dy, dx);
        }

        // LÓGICA DE DIREÇÃO (F/R/N)
        function changeDirection(step) {
            if (state.emergencia) return;
            const cycle = ['R', 'N', 'F'];
            let idx = cycle.indexOf(state.direcao);
            idx = (idx + step + 3) % 3; // Ciclo circular
            state.direcao = cycle[idx];
            directionDisplay.textContent = state.direcao;
        }

        // LÓGICA DE POTÊNCIA (0-8)
        function changePower(step) {
            if (state.emergencia) return;
            state.potencia = Math.max(0, Math.min(8, state.potencia + step));
            powerDisplay.textContent = state.potencia;
        }

        // LÓGICA DE FREIO (Slider)
        const brakeHandle = document.getElementById('brake-handle');
        const brakeTrack = document.getElementById('brake-track');
        const brakeFill = document.getElementById('brake-fill');
        let isDraggingBrake = false;

        brakeHandle.onmousedown = () => isDraggingBrake = true;
        window.onmouseup = () => isDraggingBrake = false;
        window.onmousemove = (e) => {
            if (!isDraggingBrake || state.emergencia) return;
            let rect = brakeTrack.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let percent = Math.max(0, Math.min(1, x / rect.width));
            state.freio = percent;
            brakeHandle.style.left = (percent * 150) + 'px';
            brakeFill.style.width = (percent * 100) + '%';
        };

        // EMERGÊNCIA
        function toggleEmergency() {
            state.emergencia = !state.emergencia;
            const btn = document.getElementById('btn-emerg');
            const gDir = document.getElementById('group-dir');
            const gPot = document.getElementById('group-pot');
            const gBrk = document.getElementById('group-brake');

            if (state.emergencia) {
                btn.classList.add('active');
                gDir.classList.add('disabled');
                gPot.classList.add('disabled');
                gBrk.classList.add('disabled');
            } else {
                btn.classList.remove('active');
                gDir.classList.remove('disabled');
                gPot.classList.remove('disabled');
                gBrk.classList.remove('disabled');
            }
        }

        // BUZINA
        function playHorn() {
            const audio = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-alarm-digital-clock-beep-989.mp3');
            audio.play();
        }

        // LOOP DE FÍSICA
        function update() {
            // 1. Calcular velocidade alvo
            let velAlvo = 0;
            if (state.direcao === 'F') velAlvo = velLimites[state.potencia];
            if (state.direcao === 'R') velAlvo = -velLimites[state.potencia];

            // 2. Aplicar aceleração/desaceleração
            if (state.emergencia) {
                // Frenagem de emergência (forte mas gradual)
                state.velocidadeAtual *= 0.95;
            } else {
                // Aceleração normal
                if (state.velocidadeAtual < velAlvo) state.velocidadeAtual += 0.1;
                if (state.velocidadeAtual > velAlvo) state.velocidadeAtual -= 0.1;

                // Aplicar freio manual
                if (state.freio > 0) {
                    state.velocidadeAtual *= (1 - (state.freio * 0.03));
                }
            }

            // Atrito natural
            state.velocidadeAtual *= 0.995;
            if (Math.abs(state.velocidadeAtual) < 0.5) state.velocidadeAtual = 0;

            // Atualizar progresso no trilho
            state.progresso += (state.velocidadeAtual / 1000);
            state.progresso = Math.max(0, Math.min(1, state.progresso));

            // Atualizar HUD
            speedDisplay.textContent = Math.abs(state.velocidadeAtual).toFixed(1);
            powerDisplay.textContent = state.potencia;

            draw();
            requestAnimationFrame(update);
        }

        // DESENHO DO CENARIO E TREM
        function draw() {
            // Limpar tela
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenhar trilhos (linha principal + dormentes)
            ctx.strokeStyle = "#555";
            ctx.lineWidth = 4;
            ctx.beginPath();
            for (let i = 0; i < trilho.length; i++) {
                ctx.lineTo(trilho[i].x, trilho[i].y);
            }
            ctx.stroke();

            // Dormentes (pequenos retângulos)
            ctx.fillStyle = "#333";
            ctx.fillRect(95, 195, 5, 10);
            ctx.fillRect(195, 195, 5, 10);
            ctx.fillRect(295, 175, 5, 10);
            ctx.fillRect(395, 145, 5, 10);
            ctx.fillRect(495, 115, 5, 10);
            ctx.fillRect(595, 95, 5, 10);
            ctx.fillRect(695, 95, 5, 10);
            ctx.fillRect(695, 395, 5, 10);
            ctx.fillRect(595, 395, 5, 10);
            ctx.fillRect(495, 415, 5, 10);
            ctx.fillRect(395, 445, 5, 10);
            ctx.fillRect(295, 475, 5, 10);
            ctx.fillRect(195, 495, 5, 10);
            ctx.fillRect(95, 495, 5, 10);

            // Estações (início e fim)
            ctx.fillStyle = "#ddd";
            ctx.fillRect(80, 180, 40, 40); // Estação inicial
            ctx.fillRect(680, 90, 40, 40);  // Estação final
            ctx.fillStyle = "#a52a2a";
            ctx.fillRect(80, 180, 40, 5);   // Plataforma
            ctx.fillRect(680, 90, 40, 5);

            // Desenhar composição (locomotiva + 4 vagões)
            const numVagoes = 5;
            const espacamento = 0.02; // Distância entre vagões no trilho

            for (let i = 0; i < numVagoes; i++) {
                const pos = getPosicaoNoTrilho(state.progresso - (i * espacamento));
                const angle = getAnguloNoTrilho(state.progresso - (i * espacamento));

                ctx.save();
                ctx.translate(pos.x, pos.y);
                ctx.rotate(angle);

                // Cor: Locomotiva (azul) vs Vagões (cinza)
                ctx.fillStyle = (i === 0) ? "#0000ff" : "#555";
                ctx.fillRect(-15, -10, 30, 20);

                // Janelas (detalhe)
                if (i === 0) {
                    ctx.fillStyle = "lightblue";
                    ctx.fillRect(5, -5, 5, 10);
                }

                ctx.restore();
            }

            // Desenhar paisagem (gramado, árvores, etc.)
            ctx.fillStyle = "#2E7D32";
            ctx.fillRect(0, 400, 800, 100); // Gramado
            ctx.fillStyle = "#8BC34A";
            ctx.fillRect(0, 450, 800, 50); // Gramado mais claro

            // Árvores
            ctx.fillStyle = "#4CAF50";
            ctx.beginPath();
            ctx.arc(150, 420, 20, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#2E7D32";
            ctx.fillRect(140, 400, 20, 20);

            ctx.beginPath();
            ctx.arc(650, 430, 25, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#2E7D32";
            ctx.fillRect(640, 405, 25, 25);
        }

        // Iniciar simulação
        update();
    </script>
</body>
</html>
