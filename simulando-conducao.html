
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102b3f">

  <title>Simulando Condução 2.0 | Mundo Ferroviário</title>

  <link rel="stylesheet" href="simulando-conducao.css">
</head>

<body>

  <header class="sim-header">
    <div class="sim-brand">
      <span class="brand-symbol">MF</span>
      <div>
        <h1>Simulando Condução 2.0</h1>
        <p>Mundo Ferroviário</p>
      </div>
    </div>
    <div class="sim-status">
      <span class="status-light"></span>
      CENÁRIO DE OPERAÇÃO
    </div>
  </header>

  <main class="sim-main">

    <section class="scenario-heading">
      <h2>Ambiente ferroviário</h2>
      <p>Visão superior • Planta operacional</p>
    </section>

    <section class="scenario-panel">

      <div class="scenario-topbar">
        <span>ÁREA OPERACIONAL</span>
        <span>ESTAÇÃO 1 — ESTAÇÃO 2</span>
      </div>

      <div class="scenario-viewport">

        <svg
          id="railwayScenario"
          class="railway-scenario"
          viewBox="0 0 700 1000"
          xmlns="http://www.w3.org/2000/svg"
          role="img"
          aria-label="Planta ferroviária com fazenda, áreas urbanas, rodovia azul, circuito ferroviário, duas estações e passagem em nível">

          <defs>

            <pattern id="grass" width="30" height="30" patternUnits="userSpaceOnUse">
              <rect width="30" height="30" fill="#56804e"/>
              <circle cx="6" cy="8" r="1.5" fill="#719866"/>
              <circle cx="23" cy="22" r="1.3" fill="#416b40"/>
            </pattern>

            <pattern id="farmRows" width="24" height="24" patternUnits="userSpaceOnUse">
              <rect width="24" height="24" fill="#d98b42"/>
              <path d="M0 5H24 M0 17H24" stroke="#a96835" stroke-width="2"/>
              <path d="M5 0V24 M17 0V24" stroke="#e9a45a" stroke-width="1"/>
            </pattern>

            <pattern id="urbanGround" width="20" height="20" patternUnits="userSpaceOnUse">
              <rect width="20" height="20" fill="#d875bd"/>
              <path d="M0 10H20 M10 0V20" stroke="#e99bd4" stroke-width="1"/>
            </pattern>

            <pattern id="roadMarkings" width="48" height="12" patternUnits="userSpaceOnUse">
              <rect width="48" height="12" fill="#41494e"/>
              <path d="M0 6H26" stroke="#f3e5a9" stroke-width="2" stroke-dasharray="12 8"/>
            </pattern>

            <pattern id="sleepers" width="22" height="22" patternUnits="userSpaceOnUse">
              <rect width="22" height="22" fill="#6d6c62"/>
              <path d="M2 0V22" stroke="#493d31" stroke-width="6"/>
              <path d="M2 0V22" stroke="#92795a" stroke-width="1"/>
            </pattern>

            <g id="tree">
              <circle r="17" fill="#315c35"/>
              <circle cx="-7" cy="-5" r="10" fill="#4c7b3d"/>
              <circle cx="7" cy="-6" r="10" fill="#67924b"/>
              <circle cx="3" cy="7" r="10" fill="#3e6c38"/>
            </g>

            <g id="house">
              <rect x="-19" y="-14" width="38" height="28" rx="2" fill="#e9d5b4" stroke="#594b40" stroke-width="2"/>
              <path d="M-24 -12L0 -31L24 -12Z" fill="#9c4b3d" stroke="#633c34" stroke-width="2"/>
              <rect x="-5" y="-2" width="10" height="16" fill="#76533c"/>
              <rect x="-15" y="-7" width="7" height="7" fill="#7ca9bd"/>
              <rect x="8" y="-7" width="7" height="7" fill="#7ca9bd"/>
            </g>

            <g id="building">
              <rect x="-22" y="-23" width="44" height="46" fill="#c5cbd0" stroke="#5b6871" stroke-width="2"/>
              <rect x="-16" y="-17" width="9" height="9" fill="#6d9db2"/>
              <rect x="7" y="-17" width="9" height="9" fill="#6d9db2"/>
              <rect x="-16" y="0" width="9" height="9" fill="#6d9db2"/>
              <rect x="7" y="0" width="9" height="9" fill="#6d9db2"/>
              <rect x="-5" y="10" width="10" height="13" fill="#75675b"/>
            </g>

            <g id="wagon">
              <rect x="-37" y="-14" width="74" height="28" rx="5" fill="#aeb5b5" stroke="#27343b" stroke-width="3"/>
              <rect x="-30" y="-9" width="60" height="18" rx="3" fill="#7d898a"/>
              <path d="M-20 -8V8 M0 -8V8 M20 -8V8" stroke="#c9ceca" stroke-width="2"/>
              <circle cx="-23" cy="-17" r="4" fill="#20272a"/>
              <circle cx="23" cy="-17" r="4" fill="#20272a"/>
              <circle cx="-23" cy="17" r="4" fill="#20272a"/>
              <circle cx="23" cy="17" r="4" fill="#20272a"/>
            </g>

          </defs>

          <!-- TERRENO GERAL -->
          <rect width="700" height="1000" fill="url(#grass)"/>
          <rect x="12" y="12" width="676" height="976" rx="12"
            fill="none" stroke="#a6c19a" stroke-width="3"/>

          <!-- FAZENDA / ÁREA RURAL -->
          <path d="M28 125
            L470 125
            Q520 125 535 165
            L555 245
            L535 420
            Q530 455 490 455
            L345 455
            Q320 455 315 425
            L300 330
            L45 330
            Q25 330 25 300Z"
            fill="#df9147" stroke="#f3b36c" stroke-width="5"/>

          <!-- PLANTAÇÕES -->
          <path d="M48 155H460V210H48Z" fill="url(#farmRows)"/>
          <path d="M45 225H490V285H45Z" fill="url(#farmRows)"/>
          <path d="M345 305H510V420H345Z" fill="url(#farmRows)"/>

          <text x="385" y="250" fill="#fff5e8"
            font-size="34" font-weight="bold"
            text-anchor="middle" transform="rotate(17 385 250)">ÁREA RURAL</text>

          <!-- CASA DA FAZENDA -->
          <g transform="translate(90 185)">
            <use href="#house"/>
          </g>
          <text x="90" y="225" text-anchor="middle" fill="#fff" font-size="12">FAZENDA</text>

          <!-- CERCADO DOS ANIMAIS -->
          <rect x="365" y="335" width="125" height="90"
            fill="#a7a45d" stroke="#694d31" stroke-width="5"/>
          <path d="M385 335V425 M410 335V425 M435 335V425 M460 335V425
            M365 360H490 M365 400H490"
            stroke="#684a2e" stroke-width="4"/>

          <!-- ANIMAIS -->
          <g fill="#f0e7d5" stroke="#594b3b" stroke-width="2">
            <ellipse cx="390" cy="380" rx="13" ry="8"/>
            <circle cx="403" cy="376" r="5"/>
            <ellipse cx="450" cy="380" rx="13" ry="8"/>
            <circle cx="463" cy="376" r="5"/>
          </g>
          <g fill="#5b4735">
            <circle cx="386" cy="378" r="3"/>
            <circle cx="447" cy="378" r="3"/>
          </g>
          <text x="427" y="443" text-anchor="middle" fill="#fff" font-size="12">CERCADO</text>

          <!-- ÁREA URBANA SUPERIOR -->
          <path d="M65 310
            Q70 275 105 275
            L190 275
            Q230 280 230 325
            L225 545
            Q220 575 185 575
            L85 575
            Q55 560 55 525Z"
            fill="url(#urbanGround)" stroke="#f1a3d9" stroke-width="4"/>

          <text x="140" y="450" fill="#fff" font-size="21"
            text-anchor="middle" transform="rotate(-20 140 450)">ÁREA URBANA</text>

          <g transform="translate(105 350)"><use href="#house"/></g>
          <g transform="translate(175 350)"><use href="#house"/></g>
          <g transform="translate(105 470)"><use href="#house"/></g>
          <g transform="translate(175 500)"><use href="#house"/></g>

          <!-- ÁREA URBANA INFERIOR -->
          <path d="M65 720
            Q70 690 110 690
            L620 720
            Q650 725 650 755
            L650 810
            Q645 835 615 835
            L110 830
            Q65 825 65 790Z"
            fill="url(#urbanGround)" stroke="#f1a3d9" stroke-width="4"/>

          <text x="360" y="790" fill="#fff" font-size="25"
            font-weight="bold" text-anchor="middle">ÁREA URBANA</text>

          <g transform="translate(120 755)"><use href="#house"/></g>
          <g transform="translate(205 755)"><use href="#house"/></g>
          <g transform="translate(300 755)"><use href="#building"/></g>
          <g transform="translate(385 755)"><use href="#building"/></g>
          <g transform="translate(485 755)"><use href="#house"/></g>
          <g transform="translate(575 755)"><use href="#house"/></g>

          <!-- RODOVIA AZUL: TRAÇADO DO ESBOÇO -->
          <path id="highway"
            d="M10 600
            C95 585 175 585 225 630
            C270 675 300 710 385 710
            L555 710
            C615 710 650 680 650 620
            L650 35"
            fill="none" stroke="#287fc6" stroke-width="24"
            stroke-linecap="round" stroke-linejoin="round"/>

          <path d="M10 600
            C95 585 175 585 225 630
            C270 675 300 710 385 710
            L555 710
            C615 710 650 680 650 620
            L650 35"
            fill="none" stroke="#65b5ed" stroke-width="3"
            stroke-linecap="round"/>

          <text x="610" y="430" fill="#fff" font-size="17"
            transform="rotate(-90 610 430)">RODOVIA</text>

          <!-- RODOVIA / VEÍCULOS -->
          <g id="roadVehicles">

            <g transform="translate(370 710) rotate(0)">
              <rect x="-24" y="-12" width="48" height="24" rx="6" fill="#e7e9e8" stroke="#30383b" stroke-width="2"/>
              <rect x="-10" y="-9" width="20" height="18" fill="#6594aa"/>
              <circle cx="-15" cy="-13" r="4" fill="#20272a"/>
              <circle cx="15" cy="-13" r="4" fill="#20272a"/>
              <circle cx="-15" cy="13" r="4" fill="#20272a"/>
              <circle cx="15" cy="13" r="4" fill="#20272a"/>
            </g>

            <g transform="translate(550 710)">
              <rect x="-28" y="-13" width="56" height="26" rx="5" fill="#d64c3e" stroke="#30383b" stroke-width="2"/>
              <rect x="-12" y="-10" width="23" height="20" fill="#6594aa"/>
              <circle cx="-18" cy="-14" r="4" fill="#20272a"/>
              <circle cx="18" cy="-14" r="4" fill="#20272a"/>
              <circle cx="-18" cy="14" r="4" fill="#20272a"/>
              <circle cx="18" cy="14" r="4" fill="#20272a"/>
            </g>

          </g>

          <!-- FERROVIA: TRAÇADO PRETO DO ESBOÇO -->
          <g id="railwayTracks">

            <!-- LASTRO -->
            <path id="railRoute"
              d="M145 100
              L430 100
              C515 100 585 135 585 210
              L585 465
              C585 540 535 585 455 585
              L350 585
              C295 585 275 550 275 490
              L275 365
              C275 315 245 290 195 290
              L115 290
              C65 290 40 330 40 390
              L40 620
              C40 685 75 720 140 720
              L235 720
              C300 720 310 775 365 790
              L520 790
              C585 790 635 765 675 765"
              fill="none" stroke="#4b4d48" stroke-width="32"
              stroke-linecap="round" stroke-linejoin="round"/>

            <!-- DORMENTES -->
            <path
              d="M145 100
              L430 100
              C515 100 585 135 585 210
              L585 465
              C585 540 535 585 455 585
              L350 585
              C295 585 275 550 275 490
              L275 365
              C275 315 245 290 195 290
              L115 290
              C65 290 40 330 40 390
              L40 620
              C40 685 75 720 140 720
              L235 720
              C300 720 310 775 365 790
              L520 790
              C585 790 635 765 675 765"
              fill="none" stroke="#927b5b" stroke-width="26"
              stroke-dasharray="5 12" stroke-linecap="butt"
              stroke-linejoin="round"/>

            <!-- TRILHO CENTRAL VISUAL -->
            <path
              d="M145 100
              L430 100
              C515 100 585 135 585 210
              L585 465
              C585 540 535 585 455 585
              L350 585
              C295 585 275 550 275 490
              L275 365
              C275 315 245 290 195 290
              L115 290
              C65 290 40 330 40 390
              L40 620
              C40 685 75 720 140 720
              L235 720
              C300 720 310 775 365 790
              L520 790
              C585 790 635 765 675 765"
              fill="none" stroke="#252b2e" stroke-width="8"
              stroke-linecap="round" stroke-linejoin="round"/>

            <!-- BRILHO DOS TRILHOS -->
            <path
              d="M145 100
              L430 100
              C515 100 585 135 585 210
              L585 465
              C585 540 535 585 455 585
              L350 585
              C295 585 275 550 275 490
              L275 365
              C275 315 245 290 195 290
              L115 290
              C65 290 40 330 40 390
              L40 620
              C40 685 75 720 140 720
              L235 720
              C300 720 310 775 365 790
              L520 790
              C585 790 635 765 675 765"
              fill="none" stroke="#bfc4c2" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>

          </g>

          <!-- ESTAÇÃO 1 -->
          <g id="station1">
            <rect x="20" y="35" width="110" height="48" rx="7"
              fill="#e9e5d9" stroke="#344b57" stroke-width="3"/>
            <path d="M15 36L75 10L135 36Z" fill="#a44b3e" stroke="#693a32" stroke-width="3"/>
            <rect x="62" y="51" width="25" height="32" fill="#72543e"/>
            <text x="75" y="68" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle">1</text>
            <text x="75" y="105" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle">ESTAÇÃO 1</text>
          </g>

          <!-- ESTAÇÃO 2 -->
          <g id="station2">
            <rect x="520" y="835" width="145" height="55" rx="7"
              fill="#e9e5d9" stroke="#344b57" stroke-width="3"/>
            <path d="M510 837L592 805L675 837Z" fill="#a44b3e" stroke="#693a32" stroke-width="3"/>
            <rect x="580" y="855" width="25" height="35" fill="#72543e"/>
            <text x="592" y="875" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle">2</text>
            <text x="592" y="920" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle">ESTAÇÃO 2</text>
          </g>

          <!-- SINAIS FERROVIÁRIOS -->
          <g id="signals">
            <g transform="translate(235 105)">
              <rect x="-4" y="0" width="8" height="55" fill="#343a3c"/>
              <rect x="-13" y="-16" width="26" height="30" rx="8" fill="#242b2d" stroke="#aeb8b8" stroke-width="2"/>
              <circle cx="0" cy="-7" r="7" fill="#df4c43"/>
            </g>

            <g transform="translate(190 735)">
              <rect x="-4" y="0" width="8" height="70" fill="#343a3c"/>
              <rect x="-13" y="-16" width="26" height="30" rx="8" fill="#242b2d" stroke="#aeb8b8" stroke-width="2"/>
              <circle cx="0" cy="-7" r="7" fill="#df4c43"/>
            </g>
          </g>

          <!-- PASSAGEM EM NÍVEL -->
          <g id="levelCrossing">
            <rect x="0" y="570" width="85" height="65"
              fill="#a9a79c" opacity=".65"/>
            <path d="M5 585H80 M5 620H80"
              stroke="#f1e9d2" stroke-width="4"/>

            <path d="M5 580L25 590L5 600L25 610L5 620"
              fill="none" stroke="#e7c23e" stroke-width="8"/>

            <g id="barrier">
              <rect x="8" y="548" width="12" height="30" rx="3" fill="#e2b532"/>
              <path d="M14 555L70 525" stroke="#eee" stroke-width="8"/>
              <path d="M14 555L70 525" stroke="#c83b32" stroke-width="3" stroke-dasharray="10 10"/>
            </g>

            <text x="95" y="575" fill="#fff" font-size="14" font-weight="bold">PASSAGEM DE NÍVEL</text>
            <text x="95" y="593" fill="#fff" font-size="11">CANCELA COM SINAL</text>
          </g>

          <!-- ÁRVORES E VEGETAÇÃO -->
          <g id="vegetation">
            <use href="#tree" x="30" y="180"/>
            <use href="#tree" x="560" y="90"/>
            <use href="#tree" x="650" y="350"/>
            <use href="#tree" x="35" y="850"/>
            <use href="#tree" x="680" y="950"/>
            <use href="#tree" x="470" y="950"/>
          </g>

          <!-- COMPOSIÇÃO FERROVIÁRIA -->
          <g id="trainComposition">

            <g id="wagon4" transform="translate(190 100)">
              <use href="#wagon"/>
            </g>

            <g id="wagon3" transform="translate(270 100)">
              <use href="#wagon"/>
            </g>

            <g id="wagon2" transform="translate(350 100)">
              <use href="#wagon"/>
            </g>

            <g id="wagon1" transform="translate(430 100)">
              <use href="#wagon"/>
            </g>

            <g id="locomotive" transform="translate(510 100)">
              <rect x="-32" y="-17" width="64" height="34" rx="7"
                fill="#102b3f" stroke="#e9b638" stroke-width="3"/>
              <rect x="-23" y="-12" width="15" height="24" rx="3"
                fill="#4f829b" stroke="#b9d1d9" stroke-width="1.5"/>
              <rect x="0" y="-12" width="20" height="24" rx="3"
                fill="#28536b"/>
              <rect x="23" y="-12" width="6" height="24" fill="#d6d6cd"/>
              <text x="8" y="5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">MF</text>
              <circle cx="-20" cy="-20" r="4" fill="#20272a"/>
              <circle cx="20" cy="-20" r="4" fill="#20272a"/>
              <circle cx="-20" cy="20" r="4" fill="#20272a"/>
              <circle cx="20" cy="20" r="4" fill="#20272a"/>
            </g>

          </g>

          <!-- IDENTIFICAÇÃO DA PLANTA -->
          <text x="350" y="970" fill="#fff" font-size="13"
            text-anchor="middle">MUNDO FERROVIÁRIO • SIMULADOR 2.0</text>

        </svg>

      </div>

      <div class="scenario-legend">
        <span><i class="legend-track"></i> Ferrovia</span>
        <span><i class="legend-road"></i> Rodovia</span>
        <span><i class="legend-locomotive"></i> Locomotiva</span>
        <span><i class="legend-wagon"></i> Vagões</span>
        <span><i class="legend-signal"></i> Sinalização</span>
      </div>

    </section>

    <footer class="sim-footer">
      <p>Mundo Ferroviário • Simulador de Condução 2.0</p>
    </footer>

  </main>

  <script src="simulando-conducao.js"></script>

</body>
</html>
