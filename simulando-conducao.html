<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulando Condução 2D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container que mantém a proporção exata da imagem 1037x1516 */
        #game-viewport {
            position: relative;
            height: 100vh; /* Ocupa a altura total da tela */
            aspect-ratio: 1037 / 1516; /* Trava a largura proporcionalmente à altura */
            background-image: url('assets/cenario-ferroviario.jpg');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* Zonas de clique - Ajustadas para a proporção da imagem */
        .btn-zone {
            position: absolute;
            background: rgba(255, 0, 0, 0.3); /* Vermelho para ajuste */
            border: 1px solid red;
            cursor: pointer;
            z-index: 10;
        }

        /* POSICIONAMENTO BASEADO NA IMAGEM 1037x1516 */
        
        #btn-buzina {
            bottom: 4.5%; 
            left: 3%;
            width: 15%;
            height: 7%;
            border-radius: 50%;
        }

        #btn-dir-up {
            bottom: 8%; 
            left: 22%;
            width: 10%;
            height: 4%;
        }

        #btn-dir-down {
            bottom: 3%; 
            left: 22%;
            width: 10%;
            height: 4%;
        }

        #btn-pot-up {
            bottom: 8%; 
            left: 38%;
            width: 10%;
            height: 4%;
        }

        #btn-pot-down {
            bottom: 3%; 
            left: 38%;
            width: 10%;
            height: 4%;
        }

        #slider-freio {
            position: absolute;
            bottom: 4.5%;
            left: 53%;
            width: 22%;
            height: 5%;
            z-index: 20;
            accent-color: #f1c40f;
        }

        #btn-emergencia {
            bottom: 4.5%;
            right: 3%;
            width: 15%;
            height: 7%;
            border-radius: 50%;
        }

        /* Texto de Status */
        .status-display {
            position: absolute;
            color: white;
            font-family: Arial, sans-serif;
            font-weight: bold;
            text-align: center;
            pointer-events: none;
            text-shadow: 2px 2px 4px black;
        }
        #txt-dir { bottom: 13%; left: 23%; width: 10%; font-size: 1.2rem; }
        #txt-pot { bottom: 13%; left: 39%; width: 10%; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div id="game-viewport">
        <!-- Displays de Texto -->
        <div id="txt-dir" class="status-display">N</div>
        <div id="txt-pot" class="status-display">0</div>

        <!-- Botões Interativos -->
        <div id="btn-buzina" class="btn-zone" onclick="buzina()"></div>
        
        <div id="btn-dir-up" class="btn-zone" onclick="mudarDir(1)"></div>
        <div id="btn-dir-down" class="btn-zone" onclick="mudarDir(-1)"></div>
        
        <div id="btn-pot-up" class="btn-zone" onclick="mudarPot(1)"></div>
        <div id="btn-pot-down" class="btn-zone" onclick="mudarPot(-1)"></div>
        
        <input type="range" id="slider-freio" min="0" max="100" value="0" oninput="freio(this.value)">
        
        <div id="btn-emergencia" class="btn-zone" onclick="emergencia()"></div>
    </div>

    <script>
        let dir = 'N';
        let pot = 0;

        function buzina() { alert("Buzina! 📢"); }
        
        function mudarDir(v) {
            if(v > 0) dir = (dir === 'N') ? 'F' : (dir === 'R' ? 'N' : 'F');
            else dir = (dir === 'F') ? 'N' : (dir === 'N' ? 'R' : 'N');
            document.getElementById('txt-dir').innerText = dir;
        }

        function mudarPot(v) {
            pot = Math.max(0, Math.min(8, pot + v));
            document.getElementById('txt-pot').innerText = pot;
        }

        function freio(v) { console.log("Freio: " + v); }
        function emergencia() { alert("EMERGÊNCIA! 🚨"); }
    </script>
</body>
</html>
