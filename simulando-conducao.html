
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102b3f">
  <title>Simulador de Condução 2.0 | Mundo Ferroviário</title>
  <link rel="stylesheet" href="simulando-conducao.css">
</head>

<body>

<main class="simulator">

  <section class="scene-frame">
    <svg id="railwayScene"
         viewBox="0 0 1200 1500"
         xmlns="http://www.w3.org/2000/svg"
         xmlns:xlink="http://www.w3.org/1999/xlink"
         role="img"
         aria-label="Ambiente ferroviário visto de cima">

      <defs>

        <!-- TERRENO -->
        <linearGradient id="ground" x2="0.8" y2="1">
          <stop offset="0" stop-color="#a8b68a"/>
          <stop offset="0.5" stop-color="#8fa477"/>
          <stop offset="1" stop-color="#748d68"/>
        </linearGradient>

        <linearGradient id="roadSurface" x2="0" y2="1">
          <stop offset="0" stop-color="#555b5e"/>
          <stop offset="0.5" stop-color="#3e4549"/>
          <stop offset="1" stop-color="#555b5e"/>
        </linearGradient>

        <linearGradient id="roof" x2="0.8" y2="1">
          <stop offset="0" stop-color="#b86d4d"/>
          <stop offset="1" stop-color="#713e32"/>
        </linearGradient>

        <linearGradient id="metal" x2="0" y2="1">
          <stop offset="0" stop-color="#d9dfe1"/>
          <stop offset="0.45" stop-color="#737f84"/>
          <stop offset="1" stop-color="#343d41"/>
        </linearGradient>

        <pattern id="grassTexture" width="38" height="38"
                 patternUnits="userSpaceOnUse">
          <rect width="38" height="38" fill="#91a77a"/>
          <path d="M4 8l3 -4 M17 25l4 -5 M30 10l3 3 M9 34l3 -4"
                stroke="#718d62" stroke-width="1.5" opacity=".55"/>
          <circle cx="25" cy="29" r="1.5" fill="#bdc18c"/>
          <circle cx="8" cy="19" r="1" fill="#d1c99b"/>
        </pattern>

        <pattern id="asphaltTexture" width="35" height="35"
                 patternUnits="userSpaceOnUse">
          <rect width="35" height="35" fill="#474d50"/>
          <circle cx="5" cy="9" r="1" fill="#697174"/>
          <circle cx="25" cy="27" r="1" fill="#697174"/>
          <circle cx="16" cy="17" r=".8" fill="#858b8c"/>
        </pattern>

        <pattern id="ballastTexture" width="24" height="24"
                 patternUnits="userSpaceOnUse">
          <rect width="24" height="24" fill="#77766f"/>
          <path d="M2 5l5 -2 3 4 -4 3z M15 14l5 -3 2 5 -4 4z"
                fill="#a29d91"/>
          <path d="M12 2l3 2 -2 3 -4 -2z M2 18l4 -2 3 4 -5 2z"
                fill="#555a58"/>
        </pattern>

        <!-- ÁRVORES -->
        <g id="tree">
          <ellipse cx="2" cy="5" rx="23" ry="19"
                   fill="#314b32" opacity=".25"/>
          <circle cx="0" cy="0" r="19" fill="#355b38"/>
          <circle cx="-9" cy="-5" r="10" fill="#527c43"/>
          <circle cx="9" cy="-7" r="11" fill="#648b4d"/>
          <circle cx="5" cy="8" r="10" fill="#426d3e"/>
          <circle cx="-3" cy="-2" r="5" fill="#86a35b" opacity=".65"/>
        </g>

        <!-- CASAS -->
        <g id="house">
          <rect x="-22" y="-17" width="44" height="37"
                fill="#d6c9ad" stroke="#786b59" stroke-width="2"/>
          <path d="M-27 -17L0 -35L27 -17L23 -12L0 -27L-23 -12Z"
                fill="url(#roof)" stroke="#583c32" stroke-width="2"/>
          <rect x="-7" y="-4" width="14" height="24" fill="#70584a"/>
          <rect x="-18" y="-10" width="9" height="9" fill="#a9c4c6"/>
          <rect x="9" y="-10" width="9" height="9" fill="#a9c4c6"/>
        </g>

        <!-- PRÉDIOS -->
        <g id="building">
          <rect x="-30" y="-24" width="60" height="48"
                fill="#c5c8c3" stroke="#777e7d" stroke-width="2"/>
          <rect x="-25" y="-19" width="50" height="38" fill="#a8b4b5"/>
          <g fill="#4f7180">
            <rect x="-20" y="-15" width="10" height="9"/>
            <rect x="-4" y="-15" width="10" height="9"/>
            <rect x="12" y="-15" width="10" height="9"/>
            <rect x="-20" y="2" width="10" height="9"/>
            <rect x="-4" y="2" width="10" height="9"/>
            <rect x="12" y="2" width="10" height="9"/>
          </g>
        </g>

        <!-- VEÍCULOS -->
        <g id="car">
          <rect x="-19" y="-10" width="38" height="20"
                rx="6" fill="#b9c1c3" stroke="#343c40" stroke-width="2"/>
          <rect x="-10" y="-8" width="20" height="16"
                rx="4" fill="#526e78"/>
          <rect x="-16" y="-7" width="4" height="5" fill="#f5e5a7"/>
          <rect x="12" y="-7" width="4" height="5" fill="#f5e5a7"/>
          <circle cx="-11" cy="10" r="4" fill="#242729"/>
          <circle cx="11" cy="10" r="4" fill="#242729"/>
        </g>

        <g id="truck">
          <rect x="-29" y="-12" width="39" height="24"
                rx="3" fill="#d6d8d4" stroke="#333b3e" stroke-width="2"/>
          <rect x="10" y="-10" width="19" height="22"
                rx="3" fill="#31566b" stroke="#263b48" stroke-width="2"/>
          <rect x="15" y="-7" width="10" height="8" fill="#9cbac3"/>
          <circle cx="-18" cy="13" r="5" fill="#202426"/>
          <circle cx="19" cy="13" r="5" fill="#202426"/>
        </g>

        <!-- PLANTAÇÃO -->
        <g id="cropRow">
          <path d="M0 0V120" stroke="#735e36" stroke-width="3"/>
          <g fill="#567c3e">
            <path d="M0 12l-7 -7 2 10z M0 25l8 -8 -2 11z
                     M0 40l-8 -7 2 11z M0 55l8 -8 -2 11z
                     M0 70l-8 -7 2 11z M0 85l8 -8 -2 11z
                     M0 100l-8 -7 2 11z M0 115l8 -8 -2 11z"/>
          </g>
        </g>

        <!-- DORMENTE -->
        <g id="sleeper">
          <rect x="-15" y="-4" width="30" height="8"
                rx="1.5" fill="#51483c"/>
          <path d="M-13 -2H13" stroke="#857969" stroke-width="1"/>
        </g>

        <!-- TRILHO -->
        <g id="railPair">
          <path d="M-7 -30V30 M7 -30V30"
                stroke="#30393d" stroke-width="4"/>
          <path d="M-7 -30V30 M7 -30V30"
                stroke="#c2c9c9" stroke-width="1.5"/>
        </g>

        <!-- SINAL -->
        <g id="signal">
          <rect x="-3" y="-3" width="6" height="30" fill="#252a2d"/>
          <rect x="-10" y="-15" width="20" height="22"
                rx="4" fill="#202629" stroke="#929b9d" stroke-width="1"/>
          <circle cx="0" cy="-9" r="4" fill="#e33b32"/>
          <circle cx="0" cy="1" r="4" fill="#45b76c"/>
        </g>

        <!-- ANIMAIS VISTOS DE CIMA -->
        <g id="cow">
          <ellipse cx="0" cy="0" rx="14" ry="9" fill="#eee9dc"/>
          <path d="M-8 -5q-5 -5 -8 1l5 5z M5 2q5 -7 9 -2l-4 6z"
                fill="#34383a"/>
          <circle cx="14" cy="-2" r="4" fill="#d6c7ae"/>
          <path d="M-8 7v5 M7 7v5" stroke="#493f35" stroke-width="2"/>
        </g>

        <g id="horse">
          <ellipse cx="0" cy="0" rx="13" ry="7" fill="#98603d"/>
          <path d="M7 -3l8 -8 5 2 -6 9z" fill="#98603d"/>
          <path d="M-8 5v8 M6 5v8" stroke="#49372c" stroke-width="2"/>
        </g>

        <!-- LOCOMOTIVA -->
        <g id="locomotive">
          <rect x="-24" y="-48" width="48" height="96"
                rx="7" fill="#102b3f"
                stroke="#d7a928" stroke-width="3"/>
          <rect x="-18" y="-39" width="36" height="22"
                rx="3" fill="#668b9a" stroke="#d7a928" stroke-width="1.5"/>
          <rect x="-18" y="20" width="36" height="19"
                rx="3" fill="#668b9a"/>
          <rect x="-20" y="-12" width="40" height="25"
                fill="#174a67" stroke="#d7a928" stroke-width="2"/>
          <path d="M-18 17H18" stroke="#f0b323" stroke-width="4"/>
          <rect x="-27" y="-39" width="4" height="12" fill="#25292b"/>
          <rect x="23" y="-39" width="4" height="12" fill="#25292b"/>
          <rect x="-27" y="27" width="4" height="12" fill="#25292b"/>
          <rect x="23" y="27" width="4" height="12" fill="#25292b"/>
          <circle cx="0" cy="-44" r="5" fill="#f4e6a5"/>
        </g>

        <!-- VAGÃO -->
        <g id="wagon">
          <rect x="-21" y="-43" width="42" height="86"
                rx="5" fill="#31566b"
                stroke="#172d3a" stroke-width="3"/>
          <path d="M-17 -35H17 M-17 35H17"
                stroke="#9aadb2" stroke-width="2"/>
          <path d="M-15 -25H15 M-15 25H15"
                stroke="#52788a" stroke-width="2"/>
          <rect x="-23" y="-33" width="4" height="13" fill="#24292b"/>
          <rect x="19" y="-33" width="4" height="13" fill="#24292b"/>
          <rect x="-23" y="20" width="4" height="13" fill="#24292b"/>
          <rect x="19" y="20" width="4" height="13" fill="#24292b"/>
        </g>

      </defs>

      <!-- TERRENO GERAL -->
      <rect width="1200" height="1500" fill="url(#ground)"/>
      <rect width="1200" height="1500" fill="url(#grassTexture)" opacity=".65"/>

      <!-- ÁREA RURAL SUPERIOR -->
      <g id="farm">

        <path d="M700 20H1180V490H770Z"
              fill="#91a878" stroke="#71865e" stroke-width="3"/>

        <!-- TALHÕES -->
        <path d="M790 55L1130 35L1150 160L810 190Z"
              fill="#9a8755"/>
        <path d="M800 65L1125 48" stroke="#c6ae72" stroke-width="5"/>
        <path d="M805 90L1130 73" stroke="#c6ae72" stroke-width="5"/>
        <path d="M808 116L1135 98" stroke="#c6ae72" stroke-width="5"/>
        <path d="M812 143L1140 124" stroke="#c6ae72" stroke-width="5"/>

        <!-- LINHAS DE CULTIVO -->
        <g transform="translate(820 220) rotate(-5)">
          <use xlink:href="#cropRow" x="0"/>
          <use xlink:href="#cropRow" x="25"/>
          <use xlink:href="#cropRow" x="50"/>
          <use xlink:href="#cropRow" x="75"/>
          <use xlink:href="#cropRow" x="100"/>
          <use xlink:href="#cropRow" x="125"/>
          <use xlink:href="#cropRow" x="150"/>
          <use xlink:href="#cropRow" x="175"/>
          <use xlink:href="#cropRow" x="200"/>
          <use xlink:href="#cropRow" x="225"/>
        </g>

        <!-- CASA DA FAZENDA -->
        <g transform="translate(930 380)">
          <rect x="-48" y="-32" width="100" height="72"
                fill="#c8b89a" stroke="#665846" stroke-width="3"/>
          <path d="M-58 -32L0 -70L62 -32L48 -23L0 -56L-46 -23Z"
                fill="#9b5140" stroke="#603c32" stroke-width="3"/>
          <rect x="-12" y="-8" width="25" height="48" fill="#614b39"/>
          <rect x="-39" y="-20" width="17" height="15" fill="#86aeb6"/>
          <rect x="23" y="-20" width="17" height="15" fill="#86aeb6"/>
        </g>

        <!-- GALPÃO -->
        <g transform="translate(1090 330)">
          <rect x="-42" y="-24" width="84" height="55"
                fill="#a8a18b" stroke="#655b4d" stroke-width="3"/>
          <path d="M-48 -24L0 -55L48 -24L0 -39Z"
                fill="#7b4a39" stroke="#563b32" stroke-width="3"/>
          <rect x="-23" y="-8" width="46" height="39" fill="#5c4b3b"/>
        </g>

        <!-- PASTO CERCADO -->
        <rect x="745" y="350" width="165" height="120"
              rx="8" fill="#8ba36c" stroke="#dfd1a8"
              stroke-width="5" stroke-dasharray="8 5"/>
        <use xlink:href="#cow" x="780" y="385"/>
        <use xlink:href="#cow" x="850" y="425"/>
        <use xlink:href="#horse" x="810" y="450"/>

        <!-- ÁRVORES DA FAZENDA -->
        <use xlink:href="#tree" x="740" y="75"/>
        <use xlink:href="#tree" x="750" y="165"/>
        <use xlink:href="#tree" x="1150" y="210"/>
        <use xlink:href="#tree" x="1130" y="450"/>
        <use xlink:href="#tree" x="960" y="480"/>
        <use xlink:href="#tree" x="700" y="430"/>

      </g>

      <!-- VEGETAÇÃO ESPALHADA -->
      <g id="vegetation">
        <use xlink:href="#tree" x="350" y="100"/>
        <use xlink:href="#tree" x="410" y="145"/>
        <use xlink:href="#tree" x="480" y="95"/>
        <use xlink:href="#tree" x="560" y="160"/>
        <use xlink:href="#tree" x="690" y="570"/>
        <use xlink:href="#tree" x="740" y="650"/>
        <use xlink:href="#tree" x="1120" y="680"/>
        <use xlink:href="#tree" x="1060" y="750"/>
        <use xlink:href="#tree" x="170" y="1000"/>
        <use xlink:href="#tree" x="250" y="1080"/>
        <use xlink:href="#tree" x="760" y="1200"/>
        <use xlink:href="#tree" x="820" y="1320"/>
      </g>

      <!-- ÁREA URBANA SUPERIOR ESQUERDA -->
      <g id="urbanNorth">
        <rect x="15" y="20" width="390" height="390"
              rx="12" fill="#9da58e"/>

        <!-- RUAS -->
        <path d="M20 170H400 M175 20V405"
              stroke="#555b5e" stroke-width="65"/>
        <path d="M20 170H400 M175 20V405"
              stroke="#e4e0ce" stroke-width="2"
              stroke-dasharray="18 16"/>

        <!-- CALÇADAS -->
        <path d="M20 132H400 M20 208H400
                 M137 20V405 M213 20V405"
              stroke="#c4c3b8" stroke-width="7"/>

        <!-- QUADRAS E CASAS -->
        <use xlink:href="#house" x="75" y="75"/>
        <use xlink:href="#house" x="285" y="75"/>
        <use xlink:href="#house" x="75" y="275"/>
        <use xlink:href="#building" x="285" y="280"/>
        <use xlink:href="#house" x="75" y="355"/>
        <use xlink:href="#house" x="310" y="355"/>

        <!-- CARROS -->
        <use xlink:href="#car" x="145" y="120" transform="rotate(90 145 120)"/>
        <use xlink:href="#car" x="240" y="170"/>
        <use xlink:href="#car" x="175" y="320" transform="rotate(90 175 320)"/>
      </g>

      <!-- RODOVIA -->
      <g id="highway">
        <path d="M0 510
                 C220 500 340 545 470 590
                 C600 640 690 620 790 550
                 C900 470 1010 500 1200 570"
              fill="none" stroke="#b8b4a7" stroke-width="92"/>

        <path d="M0 510
                 C220 500 340 545 470 590
                 C600 640 690 620 790 550
                 C900 470 1010 500 1200 570"
              fill="none" stroke="url(#asphaltTexture)" stroke-width="78"/>

        <path d="M0 510
                 C220 500 340 545 470 590
                 C600 640 690 620 790 550
                 C900 470 1010 500 1200 570"
              fill="none" stroke="#e7dfc5"
              stroke-width="2.5" stroke-dasharray="24 22"/>

        <use xlink:href="#car" x="210" y="520" transform="rotate(10 210 520)"/>
        <use xlink:href="#truck" x="350" y="560" transform="rotate(20 350 560)"/>
        <use xlink:href="#car" x="890" y="515" transform="rotate(-20 890 515)"/>
        <use xlink:href="#car" x="1040" y="530" transform="rotate(15 1040 530)"/>
      </g>

      <!-- ÁREA URBANA INFERIOR -->
      <g id="urbanSouth">
        <rect x="20" y="1110" width="650" height="370"
              rx="12" fill="#9ba58d"/>

        <!-- RUAS -->
        <path d="M20 1210H670 M20 1390H670
                 M190 1110V1480 M470 1110V1480"
              stroke="#555b5e" stroke-width="58"/>

        <path d="M20 1210H670 M20 1390H670
                 M190 1110V1480 M470 1110V1480"
              stroke="#e5dfca" stroke-width="2"
              stroke-dasharray="18 16"/>

        <!-- CALÇADAS -->
        <path d="M20 1175H670 M20 1245H670
                 M20 1355H670 M20 1425H670"
              stroke="#c4c3b8" stroke-width="6"/>

        <!-- CONSTRUÇÕES -->
        <use xlink:href="#house" x="90" y="1150"/>
        <use xlink:href="#building" x="300" y="1150"/>
        <use xlink:href="#house" x="570" y="1150"/>
        <use xlink:href="#house" x="90" y="1300"/>
        <use xlink:href="#building" x="300" y="1300"/>
        <use xlink:href="#house" x="570" y="1300"/>
        <use xlink:href="#house" x="90" y="1460"/>
        <use xlink:href="#house" x="570" y="1460"/>

        <!-- VEÍCULOS -->
        <use xlink:href="#car" x="145" y="1210"/>
        <use xlink:href="#truck" x="400" y="1390"/>
        <use xlink:href="#car" x="530" y="1210"/>
      </g>

      <!-- PÁTIO FERROVIÁRIO E LASTRO -->
      <g id="railwayInfrastructure">

        <!-- LINHA PRINCIPAL -->
        <path id="railwayRoute"
          d="M150 610
             C150 690 150 770 190 850
             C250 970 370 1010 500 960
             C610 920 650 790 650 650
             L650 500
             C650 400 610 340 520 340
             L450 340
             C370 340 330 390 330 470
             L330 620
             C330 730 400 790 500 790
             C650 790 760 720 790 600
             C830 440 800 300 900 260
             C1010 220 1080 300 1050 410
             C1020 520 950 610 900 700
             C850 790 850 900 920 980
             C990 1060 1080 1090 1080 1190"
          fill="none" stroke="url(#ballastTexture)"
          stroke-width="45" stroke-linecap="round"
          stroke-linejoin="round"/>

        <!-- DORMENTES DA LINHA PRINCIPAL -->
        <path d="M150 610
             C150 690 150 770 190 850
             C250 970 370 1010 500 960
             C610 920 650 790 650 650
             L650 500
             C650 400 610 340 520 340
             L450 340
             C370 340 330 390 330 470
             L330 620
             C330 730 400 790 500 790
             C650 790 760 720 790 600
             C830 440 800 300 900 260
             C1010 220 1080 300 1050 410
             C1020 520 950 610 900 700
             C850 790 850 900 920 980
             C990 1060 1080 1090 1080 1190"
          fill="none" stroke="#51483c"
          stroke-width="17" stroke-dasharray="2 13"
          stroke-linecap="butt"/>

        <!-- TRILHOS PRINCIPAIS -->
        <path d="M150 610
             C150 690 150 770 190 850
             C250 970 370 1010 500 960
             C610 920 650 790 650 650
             L650 500
             C650 400 610 340 520 340
             L450 340
             C370 340 330 390 330 470
             L330 620
             C330 730 400 790 500 790
             C650 790 760 720 790 600
             C830 440 800 300 900 260
             C1010 220 1080 300 1050 410
             C1020 520 950 610 900 700
             C850 790 850 900 920 980
             C990 1060 1080 1090 1080 1190"
          fill="none" stroke="#30383b"
          stroke-width="5"/>

        <path d="M150 610
             C150 690 150 770 190 850
             C250 970 370 1010 500 960
             C610 920 650 790 650 650
             L650 500
             C650 400 610 340 520 340
             L450 340
             C370 340 330 390 330 470
             L330 620
             C330 730 400 790 500 790
             C650 790 760 720 790 600
             C830 440 800 300 900 260
             C1010 220 1080 300 1050 410
             C1020 520 950 610 900 700
             C850 790 850 900 920 980
             C990 1060 1080 1090 1080 1190"
          fill="none" stroke="#bfc7c7"
          stroke-width="2"/>

        <!-- LINHA SECUNDÁRIA -->
        <path d="M650 650
                 C720 650 760 680 800 740
                 L900 850
                 C950 910 1010 930 1080 930"
              fill="none" stroke="url(#ballastTexture)"
              stroke-width="40" stroke-linecap="round"/>

        <path d="M650 650
                 C720 650 760 680 800 740
                 L900 850
                 C950 910 1010 930 1080 930"
              fill="none" stroke="#51483c"
              stroke-width="16" stroke-dasharray="2 13"/>

        <path d="M650 650
                 C720 650 760 680 800 740
                 L900 850
                 C950 910 1010 930 1080 930"
              fill="none" stroke="#30383b"
              stroke-width="5"/>

        <!-- DESVIOS E AMVs -->
        <path d="M650 650L710 650L790 600
                 M790 600L850 620L900 700
                 M800 740L850 700L900 700
                 M900 850L950 810L1010 810"
              fill="none" stroke="#77716f" stroke-width="20"/>

        <path d="M650 650L710 650L790 600
                 M790 600L850 620L900 700
                 M800 740L850 700L900 700
                 M900 850L950 810L1010 810"
              fill="none"
              stroke="#d9d5ce"
              stroke-width="5"
              stroke-linecap="round"
              stroke-linejoin="round"/>

        <!-- TRILHOS DOS DESVIOS -->
        <path d="M650 650L710 650L790 600
                 M790 600L850 620L900 700
                 M800 740L850 700L900 700
                 M900 850L950 810L1010 810"
              fill="none"
              stroke="#454545"
              stroke-width="5"
              stroke-linecap="round"
              stroke-linejoin="round"/>

        <!-- DORMENTES DOS DESVIOS -->
        <path d="M650 650L710 650L790 600
                 M790 600L850 620L900 700
                 M800 740L850 700L900 700
                 M900 850L950 810L1010 810"
              fill="none"
              stroke="#514239"
              stroke-width="13"
              stroke-dasharray="3 13"
              stroke-linecap="round"/>

        <!-- ESTAÇÃO 1 -->
        <g>
          <rect x="80" y="300" width="190" height="65" rx="5"
                fill="#c8c0ad" stroke="#665d50" stroke-width="3"/>
          <rect x="95" y="315" width="160" height="35"
                fill="#777d80"/>
          <path d="M80 300L175 270L270 300"
                fill="#7c5140" stroke="#554034" stroke-width="3"/>
          <rect x="110" y="320" width="28" height="30" fill="#344e5d"/>
          <rect x="155" y="320" width="35" height="30" fill="#344e5d"/>
          <rect x="210" y="320" width="28" height="30" fill="#344e5d"/>
        </g>

        <!-- PLATAFORMA ESTAÇÃO 1 -->
        <rect x="65" y="385" width="240" height="28" rx="3"
              fill="#b9b4a8" stroke="#77716a" stroke-width="2"/>
        <path d="M75 391H295" stroke="#e9dfc8" stroke-width="3"/>

        <!-- ESTAÇÃO 2 -->
        <g>
          <rect x="920" y="1040" width="190" height="65" rx="5"
                fill="#c8c0ad" stroke="#665d50" stroke-width="3"/>
          <rect x="935" y="1055" width="160" height="35"
                fill="#777d80"/>
