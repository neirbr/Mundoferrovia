<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <title>Simulando Condução 2D</title>
 <style>
 body, html {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: black;
  font-family: Arial, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  display: flex;
  justify-content: center;
  align-items: center;
 }

 #game-container {
  position: relative;
  /* Trava a proporção da imagem original para evitar que ela repita ou corte */
  width: 100vw;
  height: calc(100vw * (1516 / 1037)); 
  max-height: 100vh;
  max-width: calc(100vh * (1037 / 1516));
  
  background-image: url('https://raw.githubusercontent.com/neirbr/Mundoferrovia/main/assets/cenario-ferroviario.jpg');
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
 }

 .interaction-layer {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
 }

 .click-zone {
  position: absolute;
  background: rgba(255, 0, 0, 0.4); /* Vermelho para você ajustar */
  border: 1px solid red;
  cursor: pointer;
  z-index: 10;
 }

 /* POSICIONAMENTO BASEADO NA IMAGEM ORIGINAL (1037x1516) */
 /* Ajustei os valores para baterem com a barra inferior do seu print */

 #zone-buzina {
  bottom: 5%;
  left: 2%;
  width: 16%;
  height: 7%;
 }

 #zone-dir-up {
  bottom: 8%;
  left: 21%;
  width: 12%;
  height: 4%;
 }

 #zone-dir-down {
  bottom: 4%;
  left: 21%;
  width: 12%;
  height: 4%;
 }

 #zone-pot-up {
  bottom: 8%;
  left: 36%;
  width: 12%;
  height: 4%;
 }

 #zone-pot-down {
  bottom: 4%;
  left: 36%;
  width: 12%;
  height: 4%;
 }

 #zone-freio {
  bottom: 4%;
  left: 50%;
  width: 25%;
  height: 7%;
 }

 #zone-emergencia {
  bottom: 5%;
  right: 2%;
  width: 16%;
  height: 7%;
 }

 .status-text {
  position: absolute;
  color: white;
  font-weight: bold;
  text-shadow: 2px 2px 2px black;
  pointer-events: none;
  font-size: 18px;
  text-align: center;
 }

 #txt-direcao { bottom: 9%; left: 22%; }
 #txt-potencia { bottom: 9%; left: 37%; }
 #txt-velocidade { bottom: 2%; right: 15%; color: #00ff00; font-size: 22px; }
 </style>
</head>
<body>

 <div id="game-container">
  <div class="interaction-layer">
   <div id="zone-buzina" class="click-zone" onclick="buzina()"></div>
   <div id="zone-dir-up" class="click-zone" onclick="mudarDir(1)"></div>
   <div id="zone-dir-down" class="click-zone" onclick="mudarDir(-1)"></div>
   <div id="zone-pot-up" class="click-zone" onclick="mudarPot(1)"></div>
   <div id="zone-pot-down" class="click-zone" onclick="mudarPot(-1)"></div>
   <div id="zone-freio" class="click-zone" onclick="freio()"></div>
   <div id="zone-emergencia" class="click-zone" onclick="emergencia()"></div>

   <div id="txt-direcao" class="status-text">N</div>
   <div id="txt-potencia" class="status-text">0</div>
   <div id="txt-velocidade" class="status-text">0</div>
  </div>
 </div>

 <script>
  let dir = 'N';
  let pot = 0;

  function buzina() { alert("Buzina! 📢"); }
  function mudarDir(v) {
   if(v > 0) dir = (dir === 'N') ? 'F' : (dir === 'R' ? 'N' : 'F');
   else dir = (dir === 'F') ? 'N' : (dir === 'N' ? 'R' : 'N');
   document.getElementById('txt-direcao').innerText = dir;
  }
  function mudarPot(v) {
   pot = Math.max(0, Math.min(8, pot + v));
   document.getElementById('txt-potencia').innerText = pot;
  }
  function freio() { alert("Freando..."); }
  function emergencia() { alert("EMERGÊNCIA! 🚨"); }
 </script>
</body>
</html>
