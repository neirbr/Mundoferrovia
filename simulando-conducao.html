<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <title>Simulador Ferroviário</title>
 <style>
  body, html { margin: 0; padding: 0; background: black; font-family: Arial, sans-serif; overflow: hidden; }

 #game-container {
 position: relative;
 display: inline-block;
 margin: 0 auto;
 }

 #cenario {
 display: block;
 max-width: 100%;
 height: auto;
 }

 .interaction-layer {
 position: absolute;
 top: 0;
 left: 0;
 width: 100%;
 height: 100%;
 }

 /* TEXTOS DE STATUS */
 .status-text {
 position: absolute;
 color: white;
 font-weight: bold;
 text-shadow: 2px 2px 4px black;
 pointer-events: none;
 font-size: 18px;
 display: flex;
 align-items: center;
 justify-content: center;
 }

 /* Mantivemos apenas a velocidade, ajustei a posição para ficar visível */
 #txt-velocidade { 
 bottom: 10.5%; 
 left: 52%; 
 width: 25%; 
 color: #00ff00; 
 font-size: 22px; 
 justify-content: flex-end; 
 }
 </style>
</head>
<body style="text-align: center;">

 <div id="game-container">
 <img id="cenario" src="https://raw.githubusercontent.com/neirbr/Mundoferrovia/main/assets/cenario-ferroviario.jpg">

 <div class="interaction-layer">
 <!-- Removido: area-freio (bolinha amarela) -->
 <!-- Removido: txt-direcao (N) -->
 <!-- Removido: txt-potencia (0) -->
 
 <div id="txt-velocidade" class="status-text">0 km/h</div>
 </div>
 </div>

 <script>
 let direcao = 'N';
 let pontoAceleracao = 0;
 let velocidadeAtual = 0;
 let valorFreio = 0;
 let emergenciaAtiva = false;
 let freiosTravados = false;

 const limitesVelocidade = { 0: 0, 1: 15, 2: 25, 3: 35, 4: 45, 5: 55, 6: 65, 7: 75, 8: 100 };

 function atualizarFreio(val) {
 if (emergenciaAtiva) return;
 valorFreio = val / 100; 
 }

 function aliviarFreios() {
 emergenciaAtiva = false;
 freiosTravados = false;
 valorFreio = 0;
 }

 setInterval(() => {
 if (freiosTravados) return;

 let velAlvo = (direcao !== 'N') ? limitesVelocidade[pontoAceleracao] : 0;

 if (velocidadeAtual < velAlvo) velocidadeAtual += 0.1;
 else if (velocidadeAtual > velAlvo) velocidadeAtual -= 0.05;

 if (valorFreio > 0) {
 velocidadeAtual -= (valorFreio * 0.8);
 }

 if (emergenciaAtiva) {
 velocidadeAtual -= 0.8;
 if (velocidadeAtual <= 0) {
 velocidadeAtual = 0;
 freiosTravados = true;
 }
 }

 if (velocidadeAtual < 0) velocidadeAtual = 0;
 document.getElementById('txt-velocidade').innerText = Math.round(velocidadeAtual) + " km/h";
 }, 50);

 window.addEventListener('dblclick', aliviarFreios);
 </script>
</body>
</html>
