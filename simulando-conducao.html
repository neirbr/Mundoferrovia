<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulador Ferroviário</title>
    <!-- Link para o seu arquivo CSS -->
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <div id="game-container">
        <div id="txt-velocidade">0 km/h</div>

        <div id="control-panel">
            <div class="control-section">
                <div class="control-label">BUZINA</div>
                <div class="btn-buzina" onclick="buzina()">
                    <svg viewBox="0 0 24 24"><path d="M12 4L5 9H2v6h3l7 5V4zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.74 2.5-2.26 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </div>
            </div>

            <div class="control-section">
                <div class="control-label">DIREÇÃO</div>
                <div class="arrow-control">
                    <button class="arrow-btn" onclick="mudarDirecao(1)"><div class="arrow-up"></div></button>
                    <div class="control-display-circle" id="txt-direcao">N</div>
                    <button class="arrow-btn" onclick="mudarDirecao(-1)"><div class="arrow-down"></div></button>
                </div>
            </div>

            <div class="control-section">
                <div class="control-label">POTÊNCIA</div>
                <div class="arrow-control">
                    <button class="arrow-btn" onclick="mudarPotencia(1)"><div class="arrow-up"></div></button>
                    <div class="control-display-circle" id="txt-potencia">0</div>
                    <button class="arrow-btn" onclick="mudarPotencia(-1)"><div class="arrow-down"></div></button>
                </div>
            </div>

            <div class="control-section" style="flex: 1.4;">
                <div class="control-label">FREIO</div>
                <div class="brake-container">
                    <input type="range" id="range-freio" min="0" max="100" value="0" oninput="atualizarFreio(this.value)">
                </div>
            </div>

            <div class="control-section">
                <div class="control-label">EMERGÊNCIA</div>
                <div class="btn-emergencia" onclick="acionarEmergencia()">!</div>
            </div>
        </div>

        <div class="interaction-layer"></div>
    </div>

    <!-- Link para o seu arquivo JS -->
    <script src="script.js"></script>
</body>
</html>
