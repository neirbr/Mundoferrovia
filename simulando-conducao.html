<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <title>Simulador Ferroviário Profissional</title>
 <style>
 /* ... (Mantendo seu CSS de layout e botões imersivos do passo anterior) ... */
 body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: black; font-family: Arial, sans-serif; }
 #game-container { position: relative; width: 100vw; height: 100vh; background-image: url('https://raw.githubusercontent.com/neirbr/Mundoferrovia/main/assets/cenario-ferroviario.jpg'); background-size: cover; background-position: center; }
 .interaction-layer { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
 .btn-sim { position: absolute; cursor: pointer; border: 2px solid rgba(255,255,255,0.2); border-radius: 8px; transition: all 0.1s ease; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; text-shadow: 1px 1px 2px black; box-shadow: inset 0px 0px 10px rgba(0,0,0,0.5); }
 .btn-sim:active { transform: scale(0.95); filter: brightness(1.3); }
 .btn-metal { background: linear-gradient(to bottom, #888, #444); }
 #btn-buzina { bottom: 2%; left: 2%; width: 15%; height: 8%; background: linear-gradient(to bottom, #a67c52, #5d3a1a); border-radius: 15px; }
 #btn-dir-up { bottom: 6%; left: 22%; width: 10%; height: 4%; }
 #btn-dir-down { bottom: 2%; left: 22%; width: 10%; height: 4%; }
 #btn-pot-up { bottom: 6%; left: 37%; width: 10%; height: 4%; }
 #btn-pot-down { bottom: 2%; left: 37%; width: 10%; height: 4%; }
 #btn-freio { bottom: 2%; left: 50%; width: 25%; height: 8%; background: linear-gradient(to bottom, #ffcc00, #ff8800); border-radius: 20px; transform: translateX(-50%); color: black; }
 #btn-emergencia { bottom: 2%; right: 2%; width: 15%; height: 8%; background: radial-gradient(circle, #ff4444, #880000); border-radius: 50%; }
 .status-text { position: absolute; color: white; font-weight: bold; text-shadow: 2px 2px 2px black; pointer-events: none; font-size: 18px; }
 #txt-direcao { bottom: 11%; left: 22%; }
 #txt-potencia { bottom: 11%; left: 37%; }
 #txt-velocidade { bottom: 2%; right: 18%; color: #00ff00; font-size: 22px; }
 </style>
</head>
<body>

 <div id="game-container">
 <div class="interaction-layer">
 <div id="btn-buzina" class="btn-sim" onclick="buzina()">BUZINA</div>
 <div id="btn-dir-up" class="btn-sim btn-metal" onclick="mudarDirecao(1)">▲</div>
 <div id="btn-dir-down" class="btn-sim btn-metal" onclick="mudarDirecao(-1)">▼</div>
 <div id="btn-pot-up" class="btn-sim btn-metal" onclick="mudarPotencia(1)">▲</div>
 <div id="btn-pot-down" class="btn-sim btn-metal" onclick="mudarPotencia(-1)">▼</div>
 <div id="btn-freio" class="btn-sim" onmousedown="startBrake()" onmouseup="stopBrake()" ontouchstart="startBrake()" ontouchend="stopBrake()">FREIO</div>
 <div id="btn-emergencia" class="btn-sim" onclick="acionarEmergencia()">!</div>

 <div id="txt-direcao" class="status-text">N</div>
 <div id="txt-potencia" class="status-text">0</div>
 <div id="txt-velocidade" class="status-text">0 km/h</div>
 </div>
 </div>

 <script>
 // --- CONFIGURAÇÕES DE FÍSICA ---
 let direcao = 'N'; // 'F' (Frente), 'N' (Neutro), 'R' (Ré)
 let pontoAceleracao = 0;
 let velocidadeAtual = 0;
 let freioAtivo = 0; // 0 a 1 (intensidade)
 let emergenciaAtiva = false;
 let freiosTravados = false;

 const limitesVelocidade = {
  0: 0, 1: 15, 2: 25, 3: 35, 4: 45, 5: 55, 6: 65, 7: 75, 8: 100
 };

 // --- LÓGICA DE COMANDOS ---

 function mudarDirecao(v) {
  if (emergenciaAtiva) return;
  if (v > 0) {
   direcao = (direcao === 'N') ? 'F' : (direcao === 'R' ? 'N' : 'F');
  } else {
   direcao = (direcao === 'F') ? 'N' : (direcao === 'N' ? 'R' : 'N');
  }
  document.getElementById('txt-direcao').innerText = direcao;
 }

 function mudarPotencia(v) {
  if (emergenciaAtiva) return;
  pontoAceleracao = Math.max(0, Math.min(8, pontoAceleracao + v));
  document.getElementById('txt-potencia').innerText = pontoAceleracao;
 }

 function startBrake() {
  if (emergenciaAtiva) return;
  freioAtivo = 0.5; // Freio moderado ao apertar
 }

 function stopBrake() {
  freioAtivo = 0;
 }

 function acionarEmergencia() {
  emergenciaAtiva = true;
  console.log("EMERGÊNCIA ACIONADA!");
 }

 function aliviarFreios() {
  emergenciaAtiva = false;
  freiosTravados = false;
  alert("Freios aliviados. Sistemas operacionais.");
 }

 function buzina() { alert("📢 BUZINA!"); }

 // --- MOTOR DE FÍSICA (Roda a cada 50ms) ---
 setInterval(() => {
  if (freiosTravados) return;

  let velAlvo = 0;

  // 1. Define a velocidade alvo baseada no ponto (SÓ SE NÃO ESTIVER EM NEUTRO)
  if (direcao !== 'N') {
   velAlvo = limitesVelocidade[pontoAceleracao];
  } else {
   velAlvo = 0; // Em neutro, a tração é zero, mas a inércia mantém o trem andando
  }

  // 2. Aplica a aceleração gradual
  if (velocidadeAtual < velAlvo) {
   velocidadeAtual += 0.1; // Acelera devagar
  } else if (velocidadeAtual > velAlvo) {
   velocidadeAtual -= 0.05; // Desacelera por inércia
  }

  // 3. Aplica o Freio Comum
  if (freioAtivo > 0) {
   velocidadeAtual -= (freioAtivo * 0.5);
  }

  // 4. Aplica a Emergência (Parada gradual mas firme)
  if (emergenciaAtiva) {
   velocidadeAtual -= 0.3; 
   if (velocidadeAtual <= 0) {
    velocidadeAtual = 0;
    freiosTravados = true; // Trava tudo até aliviar
    setTimeout(() => { alert("Trem parado. Clique em 'Aliviar Freios' para reiniciar."); }, 500);
   }
 }

  // Impede velocidade negativa
  if (velocidadeAtual < 0) velocidadeAtual = 0;

  // Atualiza o visor (arredondado)
  document.getElementById('txt-velocidade').innerText = Math.round(velocidadeAtual) + " km/h";

 }, 50);

 // Adicionando um botão invisível ou evento para aliviar freios após a emergência
 window.addEventListener('dblclick', aliviarFreios); 
 // (Dica: Usei double click na tela para aliviar os freios da emergência)
 </script>
</body>
</html>
