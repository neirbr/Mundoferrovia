<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Condução 2D</title>
    <link rel="stylesheet" href="simulando-conducao.css">
</head>

<body>
    <div id="game-container">
        <!-- Displays de informação que aparecem sobre a imagem -->
        <div id="direction-display" class="status-display">N</div>
        <div id="power-display" class="status-display">0</div>
        <div id="speed-display" class="status-display">0 km/h</div>

        <!-- Botões invisíveis posicionados sobre os desenhos da imagem -->
        <div class="control-overlay">
            <button class="btn-invisible" onclick="acionarBuzina()"> Buzina </button>
            
            <div style="display:flex; flex-direction:column; gap:5px;">
                <button class="btn-invisible" onclick="mudarDirecao('up')"> ↑ </button>
                <button class="btn-invisible" onclick="mudarDirecao('down')"> ↓ </button>
            </div>

            <div style="display:flex; flex-direction:column; gap:5px;">
                <button class="btn-invisible" onclick="mudarPotencia('up')"> ↑ </button>
                <button class="btn-invisible" onclick="mudarPotencia('down')"> ↓ </button>
            </div>

            <button class="btn-invisible" onmousedown="ativarFreio()" onmouseup="soltarFreio()"> Freio </button>
            <button class="btn-invisible" onclick="emergencia()"> Emergência </button>
        </div>
    </div>

    <script src="simulando-conducao.js"></script>
</body>
    
</html>
